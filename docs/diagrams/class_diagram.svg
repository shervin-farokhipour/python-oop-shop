<text x="70" y="1592" font-family="Consolas, monospace" font-size="22" fill="#23344a">LEGEND: hollow triangle = inheritance; arrow = reference; filled diamond = composition intent.</text>
<text x="70" y="1631" font-family="Consolas, monospace" font-size="21" fill="#23344a">Getters/setters live in classes and use validation. Order.total_price is computed (getter only).</text>
<text x="70" y="1671" font-family="Consolas, monospace" font-size="21" fill="#23344a">Composition follows Order design; exclusive ownership / automatic deletion is not enforced by Python.</text>
<text x="70" y="1711" font-family="Consolas, monospace" font-size="21" fill="#23344a">read_products() fills Category.products explicitly while loading the product catalog.</text>
<text x="70" y="1751" font-family="Consolas, monospace" font-size="21" fill="#23344a">GUI: buyers, products and orders. Files: buyers and products. Orders stay in memory; payment is simulated.</text>
